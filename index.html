<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Песни — Telegram App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4">
    <div class="max-w-md mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-2xl font-bold tracking-tight text-amber-400">🎤 Студия Текстов</h1>
            <p class="text-sm text-slate-400">Черновики и идеи под рукой</p>
        </header>

        <main class="space-y-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
                <h2 class="text-lg font-semibold mb-2">Новый проект</h2>
                <input type="text" id="songTitle" placeholder="Название трека..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm mb-3 focus:outline-none focus:border-amber-400">
                <textarea id="songLyrics" rows="6" placeholder="[Куплет 1]&#10;Пишу строки здесь..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-amber-400"></textarea>
                <button onclick="saveSong()" class="w-full mt-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-2.5 rounded-lg transition">Сохранить</button>
            </div>
        </main>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        function saveSong() {
            const title = document.getElementById('songTitle').value;
            const lyrics = document.getElementById('songLyrics').value;
            if(!title) {
                alert('Введите название трека');
                return;
            }
            tg.HapticFeedback.notificationOccurred('success');
            alert('Текст сохранен в черновик!');
        }
    </script>
</body>
</html>
