<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Studio App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">

    <!-- Шапка -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center sticky top-0 bg-slate-950/80 backdrop-blur z-10">
        <div>
            <h1 class="font-bold text-amber-400 text-lg"><i class="fa-solid fa-microphone-lines mr-2"></i>Студия Текстов</h1>
            <p class="text-xs text-slate-400" id="usernameDisplay">Загрузка...</p>
        </div>
        <button onclick="triggerHaptic(); openNewProjectModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold transition">
            <i class="fa-solid fa-plus mr-1"></i> Новый
        </button>
    </header>

    <!-- Основной контент (Вкладки) -->
    <main class="p-4 max-w-md mx-auto">
        
        <!-- ВКЛАДКА 1: Проекты -->
        <section id="tab-projects" class="space-y-3">
            <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
                <button onclick="filterProjects('all')" class="px-3 py-1 bg-amber-500 text-slate-950 font-semibold rounded-full whitespace-nowrap">Все треки</button>
                <button onclick="filterProjects('active')" class="px-3 py-1 bg-slate-900 border border-slate-800 text-slate-300 rounded-full whitespace-nowrap">В работе</button>
                <button onclick="filterProjects('idea')" class="px-3 py-1 bg-slate-900 border border-slate-800 text-slate-300 rounded-full whitespace-nowrap">Идеи</button>
            </div>

            <div id="projectsList" class="space-y-3 mt-2">
                <!-- Карточка проекта 1 -->
                <div onclick="openStudio('Дико несет')" class="bg-slate-900 border border-slate-800 p-4 rounded-xl active:scale-95 transition cursor-pointer">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-base text-slate-100">Дико несет</h3>
                        <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-full">В работе</span>
                    </div>
                    <div class="text-xs text-slate-400 flex gap-4">
                        <span><i class="fa-solid fa-bolt text-amber-400 mr-1"></i> 140 BPM</span>
                        <span><i class="fa-solid fa-music text-purple-400 mr-1"></i> Dm</span>
                        <span><i class="fa-solid fa-headphones text-sky-400 mr-1"></i> 2 демо</span>
                    </div>
                </div>

                <!-- Карточка проекта 2 -->
                <div onclick="openStudio('Холодом')" class="bg-slate-900 border border-slate-800 p-4 rounded-xl active:scale-95 transition cursor-pointer">
                    <div class="flex justify-between items-start mb-2">
                        <h3 class="font-bold text-base text-slate-100">Холодом</h3>
                        <span class="text-[10px] bg-sky-500/10 text-sky-400 border border-sky-500/20 px-2 py-0.5 rounded-full">Идея</span>
                    </div>
                    <div class="text-xs text-slate-400 flex gap-4">
                        <span><i class="fa-solid fa-bolt text-amber-400 mr-1"></i> 125 BPM</span>
                        <span><i class="fa-solid fa-music text-purple-400 mr-1"></i> Am</span>
                        <span><i class="fa-solid fa-headphones text-sky-400 mr-1"></i> 1 демо</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- ВКЛАДКА 2: Редактор и Помощник Рифм -->
        <section id="tab-studio" class="hidden space-y-3">
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                <div>
                    <span id="currentSongTitle" class="font-bold text-sm block">Дико несет</span>
                    <span class="text-[11px] text-slate-400">Редактирование текста</span>
                </div>
                <button onclick="saveLyrics()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 text-xs px-3 py-1.5 font-bold rounded-lg transition">Сохранить</button>
            </div>

            <!-- Поле текста -->
            <textarea id="lyricsEditor" rows="10" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-amber-400 font-mono" placeholder="[Куплет 1]&#10;Пиши строки здесь..."></textarea>

            <!-- Блок подсказок рифм -->
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
                <div class="text-xs font-semibold text-slate-400 mb-2"><i class="fa-solid fa-wand-magic-sparkles text-amber-400 mr-1"></i> Быстрые рифмы и идеи:</div>
                <div class="flex flex-wrap gap-1.5" id="rhymeChips">
                    <button onclick="insertRhyme('ночь')" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded-lg text-slate-200 border border-slate-700">ночь</button>
                    <button onclick="insertRhyme('прочь')" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded-lg text-slate-200 border border-slate-700">прочь</button>
                    <button onclick="insertRhyme('дочь')" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded-lg text-slate-200 border border-slate-700">дочь</button>
                    <button onclick="insertRhyme('помочь')" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1 rounded-lg text-slate-200 border border-slate-700">помочь</button>
                </div>
            </div>
        </section>

        <!-- ВКЛАДКА 3: Демо сейф -->
        <section id="tab-demos" class="hidden space-y-3">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl text-center">
                <i class="fa-solid fa-microphone-lines text-3xl text-amber-400 mb-2 animate-pulse"></i>
                <h3 class="font-bold text-sm mb-1">Голосовой диктофон</h3>
                <p class="text-xs text-slate-400 mb-3">Запишите идею наброска на ходу</p>
                <button onclick="toggleRecord()" id="recBtn" class="bg-red-500 hover:bg-red-600 text-white text-xs px-4 py-2 rounded-full font-bold transition"><i class="fa-solid fa-circle mr-1.5"></i> Начать запись</button>
            </div>

            <div class="space-y-2">
                <div class="text-xs font-semibold text-slate-400">Сохраненные демо:</div>
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                    <div>
                        <div class="text-xs font-bold text-slate-200">Демо куплета v1.mp3</div>
                        <div class="text-[10px] text-slate-500">Трек: Дико несет • 0:42</div>
                    </div>
                    <button onclick="playAudio()" class="w-8 h-8 rounded-full bg-amber-500 text-slate-950 flex items-center justify-center text-xs"><i class="fa-solid fa-play ml-0.5"></i></button>
                </div>
            </div>
        </section>

    </main>

    <!-- Нижняя панель навигации -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-950/90 backdrop-blur border-t border-slate-800 p-2 flex justify-around text-xs z-10">
        <button onclick="switchTab('projects', this)" class="nav-btn text-amber-400 flex flex-col items-center py-1 px-3">
            <i class="fa-solid fa-folder-open text-base mb-0.5"></i>
            <span>Проекты</span>
        </button>
        <button onclick="switchTab('studio', this)" class="nav-btn text-slate-400 flex flex-col items-center py-1 px-3">
            <i class="fa-solid fa-pen-nib text-base mb-0.5"></i>
            <span>Студия</span>
        </button>
        <button onclick="switchTab('demos', this)" class="nav-btn text-slate-400 flex flex-col items-center py-1 px-3">
            <i class="fa-solid fa-headphones text-base mb-0.5"></i>
            <span>Демо</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Отображение имени юзера из Телеграма
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('usernameDisplay').innerText = '@' + (tg.initDataUnsafe.user.username || tg.initDataUnsafe.user.first_name);
        } else {
            document.getElementById('usernameDisplay').innerText = 'Локальный режим';
        }

        function triggerHaptic() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.selectionChanged();
            }
        }

        function switchTab(tabName, btn) {
            triggerHaptic();
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById('tab-' + tabName).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(b => {
                b.classList.remove('text-amber-400');
                b.classList.add('text-slate-400');
            });
            btn.classList.remove('text-slate-400');
            btn.classList.add('text-amber-400');
        }

        function openStudio(songName) {
            triggerHaptic();
            document.getElementById('currentSongTitle').innerText = songName;
            // Переключаемся на вкладку студии программно
            const studioBtn = document.querySelectorAll('.nav-btn')[1];
            switchTab('studio', studioBtn);
        }

        function saveLyrics() {
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            alert('Текст успешно сохранен!');
        }

        function insertRhyme(word) {
            triggerHaptic();
            const textarea = document.getElementById('lyricsEditor');
            textarea.value += ' ' + word;
        }

        let isRecording = false;
        function toggleRecord() {
            triggerHaptic();
            isRecording = !isRecording;
            const btn = document.getElementById('recBtn');
            if (isRecording) {
                btn.innerHTML = '<i class="fa-solid fa-stop mr-1.5"></i> Остановить запись';
                btn.classList.remove('bg-red-500', 'hover:bg-red-600');
                btn.classList.add('bg-amber-500', 'text-slate-950');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-circle mr-1.5"></i> Начать запись';
                btn.classList.remove('bg-amber-500', 'text-slate-950');
                btn.classList.add('bg-red-500', 'text-white');
                alert('Демо-запись сохранена в сейф!');
            }
        }

        function playAudio() {
            triggerHaptic();
            alert('Воспроизведение демо-аудио...');
        }
    </script>
</body>
</html>
